services:
  - type: web
    name: churn-prediction-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python src/train_model.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: CHURN_API_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
